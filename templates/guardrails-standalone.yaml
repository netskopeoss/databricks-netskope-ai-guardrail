AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Netskope AI Guardrails on Demand (Virtual Private Edge / VPE) — standalone
  deployment. Creates a new VPC with all networking (public + private subnets
  in two AZs, internet gateway, NAT gateway, route tables, S3 endpoint), then
  provisions the VPE appliance in an ASG behind a private ALB with a
  self-signed cert (HTTPS 443 -> appliance API on HTTP :8080) at a Route 53
  private name. INFRASTRUCTURE ONLY: tenant-side activation (enroll node,
  attach the AI Guardrails service template, generate the dataplane cert via
  the VPE CLI) is a manual step — see README. The optional GPU LLM backend is
  a separate VM and is NOT deployed here. Carved from the AWS-AIGW Reference
  Architecture (jharris-ns); the only Lambda (inline cert generator) makes this
  a single `aws cloudformation deploy` with no prebuilt artifacts.

# ============================================================
# Parameters
# ============================================================
Parameters:
  VpcCidr:
    Type: String
    Default: '10.5.0.0/16'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-2])$'
    ConstraintDescription: Must be a valid IPv4 CIDR block between /16 and /22.
    Description: >
      CIDR block for the new VPC. Four /24 subnets (2 public, 2 private) are
      carved from it, so use /22 or larger. Must not overlap networks you
      plan to peer or connect to this VPC.

  AdditionalClientCidr:
    Type: String
    Default: ''
    AllowedPattern: '^$|^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be empty or a valid IPv4 CIDR block.
    Description: >
      Optional extra CIDR (e.g. a peered VPC, Transit Gateway or VPN range)
      allowed to reach the ALB on 443 and the appliance on SSH 22. Leave empty
      to allow only the new VPC's own CIDR.

  GuardrailsAmiId:
    Type: AWS::EC2::Image::Id
    Description: >
      Netskope AI Guardrails on Demand (Virtual Private Edge / VPE) appliance
      AMI ID, shared with your account by Netskope. Must be in the region you
      deploy into (the shared image is in us-east-1; copy it or deploy in the
      same region as the share).

  GuardrailsKeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: >
      Existing EC2 key pair for SSH access to the appliance as nsadmin
      (one-time dataplane-cert CLI activation step). SSH is restricted by the
      security group to the VPC CIDR (plus AdditionalClientCidr), so it must
      be reached from inside the VPC or over peering/VPN/Transit Gateway.

  GuardrailsInstanceType:
    Type: String
    Default: m5.2xlarge
    AllowedValues:
      - m5.2xlarge
      - m5.4xlarge
      - m6i.2xlarge
      - m6i.4xlarge
    Description: >
      Instance type for the VPE appliance. Netskope virtual appliances need a
      general-purpose instance with >= 8 vCPU and >= 32 GiB RAM (m5.2xlarge
      meets the minimum). This is a CPU appliance — it does NOT need a GPU;
      GPU-based LLM detection runs on a separate VM connected via the service
      template.

  GuardrailsApiPort:
    Type: Number
    Default: 8080
    Description: >
      Port the AI Guardrails on Demand API listens on (explicit-proxy mode).
      The ALB target group forwards HTTP to this port. Default 8080.

  GuardrailsHealthCheckPath:
    Type: String
    Default: /
    Description: ALB health check path for the appliance API.

  HostedZoneName:
    Type: String
    Default: aigw.internal
    Description: >
      Name of the Route 53 PRIVATE hosted zone to create and associate with
      the new VPC. If you later associate this VPC with others that already
      resolve the same zone name (e.g. an AI Gateway or DLPoD deployment),
      choose a different name (e.g. guardrails.internal) to avoid a
      resolution collision.

  GuardrailsDomainName:
    Type: String
    Default: guardrails.aigw.internal
    Description: >
      Internal FQDN clients use to reach the Guardrails ALB. Must be within
      HostedZoneName. The self-signed ALB certificate CN/SAN matches this name.

  GuardrailsMinCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Minimum number of appliance instances.

  GuardrailsMaxCapacity:
    Type: Number
    Default: 2
    MinValue: 1
    Description: Maximum number of appliance instances (allows manual scale-out).

  GuardrailsDesiredCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Desired number of appliance instances (typically 1).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network
        Parameters:
          - VpcCidr
          - AdditionalClientCidr
      - Label:
          default: Guardrails Appliance (VPE)
        Parameters:
          - GuardrailsAmiId
          - GuardrailsInstanceType
          - GuardrailsApiPort
          - GuardrailsHealthCheckPath
      - Label:
          default: DNS & Certificate
        Parameters:
          - HostedZoneName
          - GuardrailsDomainName
      - Label:
          default: Scaling
        Parameters:
          - GuardrailsMinCapacity
          - GuardrailsDesiredCapacity
          - GuardrailsMaxCapacity
    ParameterLabels:
      VpcCidr: { default: VPC CIDR }
      AdditionalClientCidr: { default: Additional client CIDR (optional) }
      GuardrailsAmiId: { default: Guardrails on Demand (VPE) AMI ID }
      GuardrailsDomainName: { default: Guardrails Internal FQDN }
      GuardrailsApiPort: { default: Appliance API Port }

Conditions:
  HasAdditionalClientCidr: !Not [!Equals [!Ref AdditionalClientCidr, '']]

Resources:

  # =========================================================
  # VPC and networking
  # Public subnets hold the NAT gateway; the ALB and appliance live in the
  # private subnets. Private egress goes out through a single NAT gateway
  # (the appliance must reach the Netskope management plane).
  # =========================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-2'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat-eip'

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-rt'

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable
        - !Ref PrivateRouteTable

  # =========================================================
  # Cert storage
  # =========================================================

  GuardrailsCertParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${AWS::StackName}/guardrails-cert'
      Type: String
      Value: pending
      Description: >
        Self-signed ALB certificate PEM (populated by the cert generator
        custom resource). Import this into any client trust store so it can
        validate the Guardrails ALB endpoint.

  # =========================================================
  # Security Groups
  # =========================================================

  GuardrailsAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB for AI Guardrails on Demand service
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: HTTPS from within the VPC
        - !If
          - HasAdditionalClientCidr
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref AdditionalClientCidr
            Description: HTTPS from additional client CIDR
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref GuardrailsApiPort
          ToPort: !Ref GuardrailsApiPort
          CidrIp: !Ref VpcCidr
          Description: HTTP to appliance API
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-guardrails-alb-sg'

  GuardrailsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AI Guardrails on Demand (VPE) appliance
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref GuardrailsApiPort
          ToPort: !Ref GuardrailsApiPort
          SourceSecurityGroupId: !Ref GuardrailsAlbSecurityGroup
          Description: API port from ALB
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref VpcCidr
          Description: SSH for VPE CLI activation (from within the VPC)
        - !If
          - HasAdditionalClientCidr
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref AdditionalClientCidr
            Description: SSH for VPE CLI activation (additional client CIDR)
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
          Description: All outbound (Netskope management plane, NTP, upgrades)
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-guardrails-sg'

  # =========================================================
  # Route 53 private hosted zone
  # =========================================================

  PrivateHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref HostedZoneName
      VPCs:
        - VPCId: !Ref Vpc
          VPCRegion: !Ref 'AWS::Region'
      HostedZoneConfig:
        Comment: !Sub 'Private zone for ${AWS::StackName} Guardrails ALB'

  GuardrailsDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PrivateHostedZone
      Name: !Ref GuardrailsDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt GuardrailsAlb.DNSName
        HostedZoneId: !GetAtt GuardrailsAlb.CanonicalHostedZoneID

  # =========================================================
  # Self-signed CA certificate -> ACM + SSM (inline custom resource)
  # =========================================================

  CertGeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-certgen-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CertGenPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - acm:ImportCertificate
                  - acm:DeleteCertificate
                  - acm:AddTagsToCertificate
                Resource: '*'
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  CertGeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-certgen'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt CertGeneratorRole.Arn
      Code:
        ZipFile: |
          import json, subprocess, tempfile, os, logging, urllib.request, boto3
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          acm = boto3.client('acm')
          ssm = boto3.client('ssm')
          def send_cfn(event, context, status, data={}, pid=None):
              body = json.dumps({'Status': status, 'Reason': f'See CloudWatch {context.log_group_name}/{context.log_stream_name}', 'PhysicalResourceId': pid or event.get('PhysicalResourceId','none'), 'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId'], 'Data': data}).encode()
              urllib.request.urlopen(urllib.request.Request(event['ResponseURL'], data=body, headers={'Content-Type':'','Content-Length':str(len(body))}, method='PUT'))
          def handler(event, context):
              domain = event['ResourceProperties']['DomainName']
              cert_param = event['ResourceProperties']['CertParameterName']
              stack = event['ResourceProperties']['StackName']
              rt = event['RequestType']
              try:
                  if rt in ('Create', 'Update'):
                      with tempfile.TemporaryDirectory() as d:
                          kf, cf, sc = f'{d}/k.pem', f'{d}/c.pem', f'{d}/s.cnf'
                          subprocess.run(['openssl','genrsa','-out',kf,'2048'], check=True, capture_output=True)
                          with open(sc,'w') as f:
                              f.write(f"[req]\ndistinguished_name=dn\nx509_extensions=v3\nprompt=no\n[dn]\nCN={domain}\nO=Netskope\nOU=AI Guardrails\n[v3]\nsubjectAltName=DNS:{domain}\nbasicConstraints=critical,CA:TRUE\nkeyUsage=digitalSignature,keyEncipherment,keyCertSign\nextendedKeyUsage=serverAuth\n")
                          subprocess.run(['openssl','req','-new','-x509','-key',kf,'-out',cf,'-days','365','-config',sc], check=True, capture_output=True)
                          cert_pem = open(cf).read()
                          key_pem = open(kf).read()
                      r = acm.import_certificate(Certificate=cert_pem.encode(), PrivateKey=key_pem.encode(), Tags=[{'Key':'StackName','Value':stack}])
                      arn = r['CertificateArn']
                      ssm.put_parameter(Name=cert_param, Value=cert_pem, Type='String', Overwrite=True)
                      send_cfn(event, context, 'SUCCESS', {'CertificateArn': arn}, arn)
                  elif rt == 'Delete':
                      arn = event.get('PhysicalResourceId','')
                      if arn.startswith('arn:'):
                          try: acm.delete_certificate(CertificateArn=arn)
                          except: pass
                      send_cfn(event, context, 'SUCCESS', {}, arn)
              except Exception:
                  logger.exception('Failed')
                  send_cfn(event, context, 'FAILED', {}, 'FAILED')

  GuardrailsCertificate:
    Type: Custom::AlbCertificate
    Properties:
      ServiceToken: !GetAtt CertGeneratorFunction.Arn
      DomainName: !Ref GuardrailsDomainName
      CertParameterName: !Sub '/${AWS::StackName}/guardrails-cert'
      StackName: !Ref 'AWS::StackName'
      CertVersion: '1'

  # =========================================================
  # Private ALB fronting the Guardrails appliance
  # =========================================================

  GuardrailsAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Type: application
      SecurityGroups:
        - !Ref GuardrailsAlbSecurityGroup
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-guardrails-alb'

  GuardrailsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Protocol: HTTP
      Port: !Ref GuardrailsApiPort
      VpcId: !Ref Vpc
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPort: !Sub '${GuardrailsApiPort}'
      HealthCheckPath: !Ref GuardrailsHealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: 200-499
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-guardrails-tg'

  GuardrailsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref GuardrailsAlb
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !GetAtt GuardrailsCertificate.CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GuardrailsTargetGroup

  # =========================================================
  # Guardrails appliance — Launch Template + Auto Scaling Group
  # VPE appliance boots and enrolls to the Netskope tenant; no
  # UserData bootstrap and no instance IAM profile are required.
  # =========================================================

  GuardrailsLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-guardrails-lt'
      LaunchTemplateData:
        ImageId: !Ref GuardrailsAmiId
        InstanceType: !Ref GuardrailsInstanceType
        KeyName: !Ref GuardrailsKeyName
        SecurityGroupIds:
          - !Ref GuardrailsSecurityGroup
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              Encrypted: true
              VolumeSize: 1024
              VolumeType: gp3
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-guardrails'

  GuardrailsAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: PrivateRoute
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-guardrails-asg'
      LaunchTemplate:
        LaunchTemplateId: !Ref GuardrailsLaunchTemplate
        Version: !GetAtt GuardrailsLaunchTemplate.LatestVersionNumber
      MinSize: !Ref GuardrailsMinCapacity
      MaxSize: !Ref GuardrailsMaxCapacity
      DesiredCapacity: !Ref GuardrailsDesiredCapacity
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      TargetGroupARNs:
        - !Ref GuardrailsTargetGroup
      HealthCheckType: EC2
      HealthCheckGracePeriod: 900
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-guardrails'
          PropagateAtLaunch: true

# ============================================================
# Outputs
# ============================================================
Outputs:
  GuardrailsAlbDnsName:
    Description: Internal ALB DNS name fronting the AI Guardrails on Demand appliance
    Value: !GetAtt GuardrailsAlb.DNSName

  GuardrailsHostUrl:
    Description: >
      Guardrails host URL to configure on clients once the appliance is
      activated (enrolled + service template attached + dataplane cert).
    Value: !Sub 'https://${GuardrailsDomainName}'

  GuardrailsCertificateArn:
    Description: ACM ARN of the self-signed ALB certificate
    Value: !GetAtt GuardrailsCertificate.CertificateArn

  CertParameterName:
    Description: >
      SSM parameter holding the ALB certificate PEM. Import this cert into
      any client that must trust the Guardrails ALB endpoint.
    Value: !Sub '/${AWS::StackName}/guardrails-cert'

  GuardrailsAsgName:
    Description: Guardrails Auto Scaling Group name
    Value: !Ref GuardrailsAutoScalingGroup

  PrivateHostedZoneId:
    Value: !Ref PrivateHostedZone

  VpcId:
    Description: ID of the VPC created by this stack
    Value: !Ref Vpc

  PrivateSubnetIds:
    Description: Private subnets (ALB + appliance)
    Value: !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]

  PublicSubnetIds:
    Description: Public subnets (NAT gateway)
    Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]

  NatGatewayPublicIp:
    Description: Egress IP of the NAT gateway (allow-list for the Netskope management plane if required)
    Value: !Ref NatEip
